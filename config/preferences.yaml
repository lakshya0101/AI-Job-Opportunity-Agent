# ------------------------------------------------------------
# SHARED FRESHNESS
# ------------------------------------------------------------

freshness:
  preferred_age_days: 3
  maximum_age_days: 14

  include_older_if:
    - "still accepting applications"
    - "strong skill match"
    - "high location priority"

  exclude:
    - "closed"
    - "expired"
    - "deadline passed"

# ------------------------------------------------------------
# SHARED MATCHING THRESHOLDS
# ------------------------------------------------------------

matching:
  minimum_score_to_include: 55
  strong_match_threshold: 80
  very_strong_match_threshold: 90

  factors:
    role_match: 30
    skill_match: 30
    location_match: 20
    experience_match: 10
    freshness: 10

# ------------------------------------------------------------
# SHARED REPORT SETTINGS
# ------------------------------------------------------------

report:
  sections:
    - "apply_today"
    - "new_today"
    - "fresh_active"
    - "remote_india"
    - "business_analyst"
    - "other_strong_matches"

  include:
    - "company"
    - "role"
    - "location"
    - "work_mode"
    - "experience"
    - "eligibility"
    - "compensation"
    - "posting_date"
    - "freshness"
    - "source"
    - "application_url"
    - "official_careers_url"
    - "recruiter_contact"
    - "match_score"
    - "match_reason"
    - "deadline"

