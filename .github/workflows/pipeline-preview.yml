name: Pipeline Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run matching pipeline preview
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import yaml

          from src.collectors.official_careers import collect as collect_official_careers
          from src.processing.normalizer import normalize_job
          from src.processing.deduplicator import deduplicate_jobs
          from src.processing.freshness import (
              process_freshness,
              is_reportable,
              classify_freshness,
          )
          from src.matching.matcher import calculate_match
          from src.processing.filter import filter_jobs

          print("=" * 80)
          print("AI JOB OPPORTUNITY AGENT — PIPELINE PREVIEW")
          print("=" * 80)

          with open(
              "config/preferences.yaml",
              "r",
              encoding="utf-8",
          ) as f:
              preferences = yaml.safe_load(f)

          company_boards = (
              preferences
              .get("sources", {})
              .get("company_boards", [])
          )

          print(
              f"Configured companies: "
              f"{len(company_boards)}"
          )

          raw_jobs = collect_official_careers(
              company_boards
          )

          print(
              f"Raw jobs collected: "
              f"{len(raw_jobs)}"
          )

          jobs = [
              normalize_job(raw_job)
              for raw_job in raw_jobs
          ]

          print(
              f"After normalization: "
              f"{len(jobs)}"
          )

          jobs = deduplicate_jobs(jobs)

          print(
              f"After deduplication: "
              f"{len(jobs)}"
          )

          jobs = process_freshness(jobs)

          jobs = [
              calculate_match(
                  job,
                  preferences,
              )
              for job in jobs
          ]

          minimum_score = float(
              preferences
              .get("matching", {})
              .get(
                  "minimum_score_to_include",
                  55,
              )
          )

          jobs = filter_jobs(
              jobs,
              minimum_score=minimum_score,
          )

          reportable_jobs = [
              job
              for job in jobs
              if is_reportable(job)
          ]

          reportable_jobs.sort(
              key=lambda job: job.match_score,
              reverse=True,
          )

          print()
          print("=" * 80)
          print(
              f"FINAL MATCHED JOBS: "
              f"{len(reportable_jobs)}"
          )
          print(
              f"MINIMUM MATCH SCORE: "
              f"{minimum_score}"
          )
          print("=" * 80)

          for index, job in enumerate(
              reportable_jobs,
              1,
          ):
              print()
              print(
                  f"[{index}] "
                  f"{job.company}"
              )
              print(
                  f"    Role: "
                  f"{job.title}"
              )
              print(
                  f"    Location: "
                  f"{job.location}"
              )
              print(
                  f"    Score: "
                  f"{job.match_score}"
              )
              print(
                  f"    Freshness: "
                  f"{classify_freshness(job)}"
              )
              print(
                  f"    Posting Date: "
                  f"{job.posting_date or 'Not available'}"
              )
              print(
                  f"    Urgent: "
                  f"{'Yes' if job.is_urgent else 'No'}"
              )
              print(
                  f"    Reason: "
                  f"{job.match_reason}"
              )
              print(
                  f"    Application: "
                  f"{job.application_url}"
              )

          print()
          print("=" * 80)
          print("PIPELINE PREVIEW COMPLETE")
          print("=" * 80)
          PY
